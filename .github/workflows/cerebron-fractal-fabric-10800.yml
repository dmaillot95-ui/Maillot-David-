name: CEREBRON Fractal Fabric 10800 Test

on:
  push:
    paths:
      - 'cerebron/fractal_fabric/test_fractal_fabric_10800.py'
      - '.github/workflows/cerebron-fractal-fabric-10800.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-10800:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 36 x 300 micro-worker test
        run: python cerebron/fractal_fabric/test_fractal_fabric_10800.py
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-fractal-fabric-10800
          path: fractal-fabric-10800.json
          retention-days: 14
