name: CEREBRON OpenAI Useful Call
on:
  push:
    paths:
      - .github/workflows/cerebron-openai-useful-call.yml
  workflow_dispatch:

jobs:
  useful_call:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Call OpenAI for CEREBRON audit
        shell: bash
        run: |
          python -c "import os,json,urllib.request; key=os.environ['OPENAI_API_KEY']; prompt='CEREBRON: 12 farms, 240 planned GitHub jobs, 4 distinct runners already proven, CLAIM <= EVIDENCE. Return exactly four concise lines: ACTION1 + acceptance test; ACTION2 + test; ACTION3 + test; RISK + mitigation.'; body={'model':'gpt-5.6-luna','input':prompt,'reasoning':{'effort':'low'},'text':{'verbosity':'low'},'max_output_tokens':900,'store':False}; req=urllib.request.Request('https://api.openai.com/v1/responses',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method='POST'); data=json.loads(urllib.request.urlopen(req,timeout=90).read().decode()); parts=[]; [parts.extend([c.get('text','') for c in i.get('content',[]) if c.get('type')=='output_text']) for i in data.get('output',[]) if i.get('type')=='message']; text='\n'.join([p for p in parts if p]); proof={'engine':'CEREBRON_OPENAI_USEFUL_CALL_V4','model':data.get('model'),'response_id':data.get('id'),'status':data.get('status'),'output_text':text,'usage':data.get('usage',{}),'api_key_exposed':False}; print(json.dumps(proof,ensure_ascii=False)); open('cerebron-openai-useful-call.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); assert data.get('status')=='completed' and len(text)>20"
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: cerebron-openai-useful-call
          path: cerebron-openai-useful-call.json
          retention-days: 7
