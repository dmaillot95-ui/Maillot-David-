name: CEREBRON Superintelligence Core Ablation 10-to-4
on:
  push:
    paths:
      - 'cerebron/superintelligence_core_ablation_10_to_4.py'
      - '.github/workflows/cerebron-superintelligence-core-ablation-10-to-4.yml'
  workflow_dispatch:
jobs:
  ablation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core ablation
        run: python cerebron/superintelligence_core_ablation_10_to_4.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: superintelligence-core-ablation-10-to-4
          path: superintelligence_core_ablation_10_to_4.json
