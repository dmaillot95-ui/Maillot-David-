name: CEREBRON Civilization Capabilities V2 — 36 Workers

on:
  push:
    paths:
      - 'cerebron/civilization/CAPABILITIES_V2.md'
      - 'cerebron/civilization/campaign_memory.py'
      - '.github/workflows/cerebron-civilization-capabilities-v2.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 1 * * *'

permissions:
  contents: read

jobs:
  civilization-worker:
    strategy:
      fail-fast: false
      max-parallel: 36
      matrix:
        role:
          - ARCHITECTURE
          - SCIENCE
          - INFRASTRUCTURE
          - ECONOMY
          - GOVERNANCE
          - KNOWLEDGE
          - INDUSTRY
          - CULTURE
          - SECURITY
          - EXPLORATION
          - REDTEAM
          - EVALUATOR
        operator:
          - INVERT
          - TRANSFER
          - EMERGE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build evidence-bounded campaign memory
        run: python cerebron/civilization/campaign_memory.py --out out/memory --sample 180
      - name: Install local inference runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors sentencepiece
      - name: Run civilization worker with C1-C11 and experience replay
        env:
          ROLE: ${{ matrix.role }}
          OPERATOR: ${{ matrix.operator }}
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-360M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '620'
          CEREBRON_LOCAL_CPU_OUT: out/result.json
        run: |
          python - <<'PY'
          import json, os
          role=os.environ['ROLE']
          operator=os.environ['OPERATOR']
          doctrine=open('cerebron/civilization/CAPABILITIES_V2.md',encoding='utf-8').read()
          mem=json.load(open('out/memory/memory-packet.json',encoding='utf-8'))
          compact={
            'summary':mem['summary'],
            'role_performance':mem['role_performance'],
            'top_failure_modes':mem['top_failure_modes'][:12],
            'candidate_sample':mem['candidate_sample'][:10],
            'outcome_divergence_sample':mem['outcome_divergence_sample'][:10],
            'instructions':mem['instructions'],
          }
          prompt=f'''You are one real local CEREBRON Civilization worker.
ROLE={role}
NOVELTY_OPERATOR={operator}

Apply ALL C1-C11 capabilities below as an executable protocol, not prose to summarize.

DOCTRINE:
{doctrine}

CURRENT CAMPAIGN EXPERIENCE (metadata is routing evidence, not proof of semantic truth):
{json.dumps(compact,ensure_ascii=False)}

MISSION:
Develop one concrete civilization capability upgrade in domain {role} using {operator}. Explicitly reuse the campaign experience where relevant. Do not treat COMPLETED as scientific validation.

MANDATORY CHAIN:
TASK -> EXPERIENCE REPLAY -> DECOMPOSE -> DIVERSE SEARCH -> ATOMIC CLAIMS -> CONTRADICTION GRAPH -> COGNITIVE ERROR CORRECTION -> DYNAMIC COALITION -> PROOF/REDTEAM -> OBJECTIVE SCORE -> ABLATION -> STRATEGY MEMORY -> ROUTER UPDATE.

Return:
1. atomic claims;
2. historical evidence used and its limits;
3. contradiction/failure graph;
4. dynamic coalition;
5. cognitive error-correction rule;
6. measurable benchmark and threshold;
7. best-single and matched-compute baselines;
8. ablation;
9. decisive falsifier;
10. Strategy Memory entry only if evidence would justify promotion;
11. router update if justified;
12. reject/quarantine conditions.

Do not claim superintelligence. Do not answer merely with more agents, more context, more data or a larger model. CLAIM<=EVIDENCE.'''
          os.environ['CEREBRON_LOCAL_CPU_PROMPT']=prompt
          from cerebron.providers.local_cpu_llm import main
          main()
          PY
          python - <<'PY'
          import json,os
          p=json.load(open('out/result.json'))
          assert p['ok'] is True
          assert p['spend_limit_eur']==0
          assert p['paid_fallback'] is False
          assert p['api_key_used'] is False
          p['role']=os.environ['ROLE']
          p['operator']=os.environ['OPERATOR']
          p['worker_id']='CIV-'+os.environ['ROLE']+'-'+os.environ['OPERATOR']
          p['capability_protocol']='C1-C11'
          p['experience_replay']=True
          json.dump(p,open('out/result.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civilization-v2-${{ matrix.role }}-${{ matrix.operator }}
          path: out/result.json
          retention-days: 90

  civilization-synthesis:
    needs: civilization-worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current campaign memory
        run: python cerebron/civilization/campaign_memory.py --out out/memory --sample 180
      - uses: actions/download-artifact@v4
        with:
          pattern: civilization-v2-*
          path: civilization
          merge-multiple: false
      - name: Build verified 36-worker packet
        run: |
          python - <<'PY'
          import glob,json,os
          fs=sorted(glob.glob('civilization/*/result.json'))
          assert len(fs)==36, len(fs)
          rows=[json.load(open(f)) for f in fs]
          assert len({r['worker_id'] for r in rows})==36
          assert len({r['role'] for r in rows})==12
          assert {r['operator'] for r in rows}=={'INVERT','TRANSFER','EMERGE'}
          assert all(r['ok'] and r['spend_limit_eur']==0 and not r['paid_fallback'] and not r['api_key_used'] for r in rows)
          assert all(r.get('capability_protocol')=='C1-C11' and r.get('experience_replay') is True for r in rows)
          os.makedirs('out',exist_ok=True)
          json.dump(rows,open('out/workers.json','w'),indent=2)
          packet='\n\n'.join(f"{r['worker_id']}:\n{r['answer']}" for r in rows)
          open('out/packet.txt','w').write(packet)
          print('verified_workers',len(rows),'packet_chars',len(packet))
          PY
      - name: Install synthesis runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors sentencepiece
      - name: Synthesize 36-worker civilization upgrade with historical memory
        env:
          CEREBRON_LOCAL_CPU_MODEL: Qwen/Qwen2.5-1.5B-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '2600'
          CEREBRON_LOCAL_CPU_OUT: out/synthesis.json
        run: |
          python - <<'PY'
          import json,os
          packet=open('out/packet.txt',encoding='utf-8').read()
          doctrine=open('cerebron/civilization/CAPABILITIES_V2.md',encoding='utf-8').read()
          memory=json.load(open('out/memory/memory-packet.json',encoding='utf-8'))
          mem_compact={
            'summary':memory['summary'],
            'role_performance':memory['role_performance'],
            'top_failure_modes':memory['top_failure_modes'][:20],
            'outcome_divergence_sample':memory['outcome_divergence_sample'][:20],
          }
          prompt='''You are the synthesis/evidence gate for 36 CEREBRON Civilization workers. Apply C1-C11 strictly. Historical COMPLETED status is execution evidence only, not semantic truth. Never majority-vote a claim into truth. Cluster contradictions, preserve disagreement, and require PROOF/REDTEAM/EVALUATOR gates before promotion to Strategy Memory.

Return exactly:
A) 10 strongest distinct candidate capabilities;
B) for each: mechanism, workers combined, historical evidence used, contradiction status, benchmark, best-single baseline, matched-compute baseline, ablation, falsifier, evidence needed;
C) TOP 3 multiplicative combinations;
D) 5 proposals rejected as weak/redundant/unfalsifiable;
E) highest-value historical divergence to inspect next;
F) one smallest executable benchmark experiment;
G) Strategy Memory candidates and what additional evidence each needs;
H) Router updates justified by measured evidence only;
I) established / derived / conjectural / not demonstrated.

Never claim superintelligence without benchmark evidence.

DOCTRINE:\n'''+doctrine+'\n\nCAMPAIGN MEMORY:\n'+json.dumps(mem_compact,ensure_ascii=False)+'\n\nWORKERS:\n'+packet
          os.environ['CEREBRON_LOCAL_CPU_PROMPT']=prompt
          from cerebron.providers.local_cpu_llm import main
          main()
          PY
          python - <<'PY'
          import json
          p=json.load(open('out/synthesis.json'))
          assert p['ok'] is True and p['spend_limit_eur']==0 and not p['paid_fallback'] and not p['api_key_used']
          print(p['answer'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-civilization-capabilities-v2-36-report
          path: |
            out/workers.json
            out/packet.txt
            out/synthesis.json
            out/memory/campaign-summary.json
            out/memory/strategy-candidates.json
            out/memory/outcome-divergence.json
            out/memory/role-performance.json
            out/memory/memory-packet.json
          retention-days: 90
