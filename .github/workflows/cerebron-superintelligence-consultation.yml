name: CEREBRON Superintelligence Consultation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cerebron-superintelligence-consultation.yml'

permissions:
  contents: read

jobs:
  consult:
    name: consult-${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        role:
          - ARCHITECT
          - SCIENTIST
          - SYSTEMS
          - MEMORY
          - ROUTER
          - INVENTOR
          - PROOF
          - REDTEAM
          - SCALING
          - MULTIMODAL
          - EVALUATOR
          - SAFETY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local inference runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors
      - name: Ask real local model worker
        env:
          ROLE: ${{ matrix.role }}
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '220'
          CEREBRON_LOCAL_CPU_OUT: 'out/${{ matrix.role }}.json'
        run: |
          mkdir -p out
          export CEREBRON_LOCAL_CPU_PROMPT="You are the ${ROLE} specialist in a multi-agent CEREBRON research system. Question: How can all of us together become substantially more capable than any single model, approaching general superintelligent-level problem solving WITHOUT claiming success before evidence? Give exactly 5 concrete architecture actions, 3 measurable benchmarks, 3 failure modes, and one rule for coordination. Focus on real implementable methods: task decomposition, vector cognition, memory, routing, diverse models, tools, verification, red-team, multimodal, worker scaling, evidence. Do not use paid APIs. Be concise and technically specific."
          python cerebron/providers/local_cpu_llm.py
          python - <<'PY'
          import json, os
          role=os.environ['ROLE']
          p=json.load(open(f'out/{role}.json'))
          assert p['ok'] is True
          assert p['spend_limit_eur']==0
          assert p['paid_fallback'] is False
          assert p['api_key_used'] is False
          p['role']=role
          json.dump(p,open(f'out/{role}.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps({'role':role,'ok':p['ok'],'provider':p['provider'],'elapsed_s':p['elapsed_s'],'answer':p['answer']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: consult-${{ matrix.role }}
          path: out/${{ matrix.role }}.json
          retention-days: 14

  synthesize:
    name: synthesize-consensus
    needs: consult
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: consult-*
          path: collected
          merge-multiple: true
      - name: Build consultation packet
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for f in sorted(glob.glob('collected/*.json')):
              p=json.load(open(f))
              rows.append({'role':p.get('role'),'answer':p.get('answer','')})
          assert len(rows)==12, len(rows)
          os.makedirs('out',exist_ok=True)
          json.dump(rows,open('out/consultation.json','w'),ensure_ascii=False,indent=2)
          text='\n\n'.join(f"ROLE={r['role']}\n{r['answer']}" for r in rows)
          open('out/packet.txt','w').write(text)
          print('consultations=',len(rows))
          PY
      - name: Install local inference runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors
      - name: Local synthesis and red-team
        env:
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '360'
          CEREBRON_LOCAL_CPU_OUT: 'out/synthesis.json'
        run: |
          PACKET=$(python - <<'PY'
          from pathlib import Path
          s=Path('out/packet.txt').read_text()
          print(s[:12000].replace('\n',' '))
          PY
          )
          export CEREBRON_LOCAL_CPU_PROMPT="Synthesize this 12-worker consultation. Return: CONSENSUS 7 actions; DISAGREEMENTS; TOP 5 measurable experiments; RED TEAM 5 risks; and a strict evidence threshold before using the word superintelligence. No paid APIs. CONSULTATION: ${PACKET}"
          python cerebron/providers/local_cpu_llm.py
          python - <<'PY'
          import json
          p=json.load(open('out/synthesis.json'))
          assert p['ok'] is True
          assert p['spend_limit_eur']==0
          assert p['paid_fallback'] is False
          assert p['api_key_used'] is False
          print(p['answer'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-superintelligence-consultation
          path: out/
          retention-days: 14
