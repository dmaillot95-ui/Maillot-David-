name: CEREBRON Combinatorial Cognition Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cerebron-combinatorial-cognition-test.yml'

permissions:
  contents: read

jobs:
  specialists:
    name: specialist-${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        role: [ARCHITECT,SCIENTIST,SYSTEMS,MEMORY,ROUTER,INVENTOR,PROOF,REDTEAM,SCALING,MULTIMODAL,EVALUATOR,SAFETY]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors
      - name: Run specialist
        env:
          ROLE: ${{ matrix.role }}
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '180'
          CEREBRON_LOCAL_CPU_OUT: 'out/${{ matrix.role }}.json'
        run: |
          mkdir -p out
          export CEREBRON_LOCAL_CPU_PROMPT="ROLE=${ROLE}. Shared challenge: design a zero-paid multi-agent system that outperforms one isolated small model on hard research tasks without claiming superintelligence before evidence. Your unique cognitive function is ${ROLE}. Produce: 3 unique contributions from your role, 2 interactions with other roles, 1 falsification test, 1 failure mode. Avoid generic repetition."
          python cerebron/providers/local_cpu_llm.py
          python - <<'PY'
          import json,os
          r=os.environ['ROLE']; p=json.load(open(f'out/{r}.json')); p['role']=r
          assert p['ok'] is True and p['spend_limit_eur']==0 and not p['paid_fallback'] and not p['api_key_used']
          json.dump(p,open(f'out/{r}.json','w'),ensure_ascii=False,indent=2)
          print(r,p['elapsed_s'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cog-${{ matrix.role }}
          path: out/${{ matrix.role }}.json
          retention-days: 14

  baseline:
    name: isolated-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install local runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors
      - name: Run isolated model
        env:
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '360'
          CEREBRON_LOCAL_CPU_OUT: 'out/baseline.json'
          CEREBRON_LOCAL_CPU_PROMPT: 'Design a zero-paid multi-agent system that outperforms one isolated small model on hard research tasks without claiming superintelligence before evidence. Cover architecture, memory, routing, proof, red-team, scaling, multimodal, evaluation, safety, benchmarks and failure modes. Be concrete.'
        run: |
          mkdir -p out
          python cerebron/providers/local_cpu_llm.py
          python - <<'PY'
          import json
          p=json.load(open('out/baseline.json'))
          assert p['ok'] is True and p['spend_limit_eur']==0 and not p['paid_fallback'] and not p['api_key_used']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-baseline
          path: out/baseline.json
          retention-days: 14

  judge:
    name: deterministic-judge
    needs: [specialists, baseline]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cog-*
          path: specialists
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: isolated-baseline
          path: baseline
      - name: Score diversity and coverage
        run: |
          python - <<'PY'
          import json,glob,re,hashlib,os,math
          files=sorted(glob.glob('specialists/*.json'))
          assert len(files)==12,len(files)
          rows=[json.load(open(f)) for f in files]
          base=json.load(open('baseline/baseline.json'))
          texts=[r.get('answer','') for r in rows]
          roles=[r['role'] for r in rows]
          def toks(s): return set(re.findall(r'[a-zA-Z]{4,}',s.lower()))
          sets=[toks(t) for t in texts]
          union=set().union(*sets)
          inter=set.intersection(*sets) if sets else set()
          pair=[]
          for i in range(len(sets)):
            for j in range(i+1,len(sets)):
              u=sets[i]|sets[j]
              pair.append(len(sets[i]&sets[j])/len(u) if u else 1)
          base_set=toks(base.get('answer',''))
          novelty=len(union-base_set)
          report={
            'specialists':12,
            'roles_unique':len(set(roles)),
            'collective_unique_terms':len(union),
            'baseline_unique_terms':len(base_set),
            'collective_terms_not_in_baseline':novelty,
            'mean_pairwise_jaccard':round(sum(pair)/len(pair),4),
            'all_jobs_zero_paid':all(r['spend_limit_eur']==0 and not r['paid_fallback'] and not r['api_key_used'] for r in rows+[base]),
            'claim_superintelligence':False,
            'interpretation':'Measures output diversity/coverage only; does not prove superior intelligence.'
          }
          os.makedirs('out',exist_ok=True)
          json.dump(report,open('out/report.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          assert report['roles_unique']==12
          assert report['all_jobs_zero_paid'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-combinatorial-cognition-report
          path: out/report.json
          retention-days: 14
