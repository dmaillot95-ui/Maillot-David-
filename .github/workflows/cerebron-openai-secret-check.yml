name: CEREBRON OpenAI Secret Check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cerebron-openai-secret-check.yml'
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Verify secret presence without exposing it
        shell: bash
        run: |
          python - <<'PY'
          import os, json
          key=os.getenv('OPENAI_API_KEY','')
          out={
            'engine':'CEREBRON_OPENAI_SECRET_CHECK_V1',
            'secret_name':'OPENAI_API_KEY',
            'present':bool(key),
            'length_positive':len(key)>0,
            'value_exposed':False,
            'billable_api_call_made':False
          }
          print(json.dumps(out))
          assert out['present'], 'OPENAI_API_KEY secret is missing or empty'
          PY
