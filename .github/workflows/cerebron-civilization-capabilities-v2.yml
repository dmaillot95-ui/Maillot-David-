name: CEREBRON Civilization Capabilities V2 — 36 Workers

on:
  push:
    paths:
      - 'cerebron/civilization/CAPABILITIES_V2.md'
      - '.github/workflows/cerebron-civilization-capabilities-v2.yml'
  workflow_dispatch:

jobs:
  civilization-worker:
    strategy:
      fail-fast: false
      max-parallel: 36
      matrix:
        role:
          - ARCHITECTURE
          - SCIENCE
          - INFRASTRUCTURE
          - ECONOMY
          - GOVERNANCE
          - KNOWLEDGE
          - INDUSTRY
          - CULTURE
          - SECURITY
          - EXPLORATION
          - REDTEAM
          - EVALUATOR
        operator:
          - INVERT
          - TRANSFER
          - EMERGE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local inference runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors sentencepiece
      - name: Run civilization worker with all V2 capabilities
        env:
          ROLE: ${{ matrix.role }}
          OPERATOR: ${{ matrix.operator }}
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-360M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '520'
          CEREBRON_LOCAL_CPU_OUT: out/result.json
        run: |
          python - <<'PY'
          import os
          role=os.environ['ROLE']
          operator=os.environ['OPERATOR']
          doctrine=open('cerebron/civilization/CAPABILITIES_V2.md').read()
          prompt=f'''You are one real local CEREBRON Civilization V2 worker.
ROLE={role}
NOVELTY_OPERATOR={operator}

Apply ALL C1-C10 capabilities below as an executable protocol, not as prose to summarize:

{doctrine}

MISSION:
Develop one concrete civilization capability upgrade in the domain {role} using the {operator} operator.

MANDATORY EXECUTION CHAIN:
TASK -> DECOMPOSE -> DIVERSE SEARCH -> ATOMIC CLAIMS -> CONTRADICTION GRAPH -> COGNITIVE ERROR CORRECTION -> DYNAMIC COALITION -> PROOF/REDTEAM -> OBJECTIVE SCORE -> ABLATION -> STRATEGY MEMORY -> ROUTER UPDATE.

Return:
1. atomic claims;
2. contradiction/failure graph;
3. dynamic coalition and why each member is needed;
4. cognitive error-correction rule;
5. measurable benchmark and threshold;
6. best-single baseline and matched-compute baseline;
7. ablation test;
8. decisive falsifier;
9. strategy-memory record if successful;
10. router update if successful;
11. what must be rejected/quarantined if it fails.

Do not claim superintelligence. Do not answer merely with more agents, more context, more data, or a larger model. CLAIM<=EVIDENCE.'''
          os.environ['CEREBRON_LOCAL_CPU_PROMPT']=prompt
          from cerebron.providers.local_cpu_llm import main
          main()
          PY
          python - <<'PY'
          import json,os
          p=json.load(open('out/result.json'))
          assert p['ok'] is True
          assert p['spend_limit_eur']==0
          assert p['paid_fallback'] is False
          assert p['api_key_used'] is False
          p['role']=os.environ['ROLE']
          p['operator']=os.environ['OPERATOR']
          p['worker_id']='CIV-'+os.environ['ROLE']+'-'+os.environ['OPERATOR']
          p['capability_protocol']='C1-C10'
          json.dump(p,open('out/result.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civilization-v2-${{ matrix.role }}-${{ matrix.operator }}
          path: out/result.json
          retention-days: 14

  civilization-synthesis:
    needs: civilization-worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: civilization-v2-*
          path: civilization
          merge-multiple: false
      - name: Build verified 36-worker packet
        run: |
          python - <<'PY'
          import glob,json,os
          fs=sorted(glob.glob('civilization/*/result.json'))
          assert len(fs)==36, len(fs)
          rows=[json.load(open(f)) for f in fs]
          assert len({r['worker_id'] for r in rows})==36
          assert len({r['role'] for r in rows})==12
          assert {r['operator'] for r in rows}=={'INVERT','TRANSFER','EMERGE'}
          assert all(r['ok'] and r['spend_limit_eur']==0 and not r['paid_fallback'] and not r['api_key_used'] for r in rows)
          assert all(r.get('capability_protocol')=='C1-C10' for r in rows)
          os.makedirs('out',exist_ok=True)
          json.dump(rows,open('out/workers.json','w'),indent=2)
          packet='\n\n'.join(f"{r['worker_id']}:\n{r['answer']}" for r in rows)
          open('out/packet.txt','w').write(packet)
          print('verified_workers',len(rows),'packet_chars',len(packet))
          PY
      - name: Install synthesis runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors sentencepiece
      - name: Synthesize 36-worker civilization upgrade
        env:
          CEREBRON_LOCAL_CPU_MODEL: Qwen/Qwen2.5-1.5B-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '2200'
          CEREBRON_LOCAL_CPU_OUT: out/synthesis.json
        run: |
          python - <<'PY'
          import os
          packet=open('out/packet.txt').read()
          doctrine=open('cerebron/civilization/CAPABILITIES_V2.md').read()
          prompt='''You are the synthesis/evidence gate for 36 CEREBRON Civilization V2 workers (12 roles x 3 novelty operators). Apply C1-C10 strictly. Do not majority-vote claims into truth. Build contradiction clusters, preserve disagreements, use PROOF/REDTEAM/EVALUATOR gates, and only integrate claims with adequate evidence.

Return exactly:
A) 10 strongest distinct candidate capabilities;
B) for each: mechanism, workers combined, contradiction status, benchmark, best-single baseline, matched-compute baseline, ablation, falsifier, evidence needed;
C) TOP 3 multiplicative combinations;
D) 5 proposals rejected as weak/redundant/unfalsifiable;
E) one smallest executable benchmark experiment;
F) Strategy Memory entries to retain;
G) Router updates justified by evidence;
H) explicit statement of what is established, derived, conjectural, and not demonstrated.

Never claim superintelligence without benchmark evidence.

DOCTRINE:\n'''+doctrine+'\n\nWORKERS:\n'+packet
          os.environ['CEREBRON_LOCAL_CPU_PROMPT']=prompt
          from cerebron.providers.local_cpu_llm import main
          main()
          PY
          python - <<'PY'
          import json
          p=json.load(open('out/synthesis.json'))
          assert p['ok'] is True and p['spend_limit_eur']==0 and not p['paid_fallback'] and not p['api_key_used']
          print(p['answer'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-civilization-capabilities-v2-36-report
          path: |
            out/workers.json
            out/packet.txt
            out/synthesis.json
          retention-days: 14
