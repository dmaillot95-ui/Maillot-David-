name: CEREBRON Local CPU LLM Test

on:
  push:
    paths:
      - 'cerebron/providers/local_cpu_llm.py'
      - '.github/workflows/cerebron-local-cpu-llm-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-cpu-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local inference runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors
      - name: Run real zero-euro local CPU inference
        env:
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '24'
          CEREBRON_LOCAL_CPU_OUT: out/local-cpu-llm.json
        run: python cerebron/providers/local_cpu_llm.py
      - name: Verify zero-euro evidence
        run: |
          python - <<'PY'
          import json
          p=json.load(open('out/local-cpu-llm.json'))
          assert p['ok'] is True
          assert p['spend_limit_eur']==0
          assert p['paid_fallback'] is False
          assert p['api_key_used'] is False
          print('LOCAL_CPU_ZERO_EURO=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-local-cpu-llm-${{ github.run_id }}
          path: out/local-cpu-llm.json
          retention-days: 14
