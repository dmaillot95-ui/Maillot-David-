name: CEREBRON C45 Rung 50 R1
on:
  push:
    paths:
      - 'cerebron/intelligence/c45_stage_0050_r1.py'
      - 'cerebron/intelligence/c45_stage_0050_r1_preregistration.json'
      - '.github/workflows/cerebron-c45-stage-0050-r1.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run C45 rung 50 R1
        run: python cerebron/intelligence/c45_stage_0050_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-c45-stage-0050-r1-results
          path: c45_stage_0050_r1_results.json
