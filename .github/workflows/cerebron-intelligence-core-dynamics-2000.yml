name: CEREBRON Intelligence Core Dynamics 2000

on:
  push:
    paths:
      - 'cerebron/intelligence/test_intelligence_core_dynamics_2000.py'
      - '.github/workflows/cerebron-intelligence-core-dynamics-2000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamics-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 2000 dynamics funnel
        run: python cerebron/intelligence/test_intelligence_core_dynamics_2000.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-core-dynamics-2000
          path: intelligence-core-dynamics-2000.json
