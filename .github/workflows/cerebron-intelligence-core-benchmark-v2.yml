name: CEREBRON Intelligence Core Benchmark V2

on:
  push:
    paths:
      - 'cerebron/intelligence/benchmark_v2.py'
      - '.github/workflows/cerebron-intelligence-core-benchmark-v2.yml'
  workflow_dispatch:

jobs:
  benchmark-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run benchmark V2
        run: python cerebron/intelligence/benchmark_v2.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cerebron-intelligence-core-benchmark-v2-results
          path: benchmark_v2_results.json
          retention-days: 90
