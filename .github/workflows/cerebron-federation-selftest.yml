name: CEREBRON Federation Selftest

on:
  workflow_dispatch:
  push:
    paths:
      - 'cerebron/providers/federated_worker_contract.py'
      - 'cerebron/providers/federated_compute.py'
      - 'cerebron/providers/free_tier_registry.json'
      - 'cerebron/providers/provider_bank.py'
      - 'api/cerebron-worker.py'
      - 'netlify/functions/cerebron-worker.mjs'
      - 'netlify.toml'
      - 'supabase/functions/cerebron-worker/index.ts'
      - '.github/workflows/cerebron-federation-selftest.yml'

permissions:
  contents: read

jobs:
  federation-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate federation contract and free-tier policy
        run: |
          python - <<'PY'
          import json, os, pathlib, py_compile
          from cerebron.providers.federated_worker_contract import WorkerTask, validate_zero_euro
          from cerebron.providers.federated_compute import provider_status
          from cerebron.providers.provider_bank import build_bank

          task = WorkerTask.create('SELFTEST', '{"op":"sum","values":[1,2,3]}')
          validate_zero_euro(task)
          status = provider_status()
          expected = {'vercel','cloudflare','render','netlify','supabase','scaleway','alibaba','digitalocean'}
          assert set(status) == expected
          assert os.getenv('CEREBRON_FEDERATION_ENABLE','0') != '1'
          assert all(v['enabled'] is False for v in status.values())
          assert all(v['paid_fallback'] is False for v in status.values())

          registry = json.load(open('cerebron/providers/free_tier_registry.json'))
          assert registry['policy']['spend_limit_eur'] == 0
          assert registry['policy']['paid_fallback'] is False
          assert registry['policy']['payment_method_required'] is False
          approved = set(registry['approved'])
          assert {'github_actions','cloudflare','render','vercel','netlify','supabase'} <= approved
          assert 'digitalocean' in registry['excluded_or_restricted']
          assert 'github_models' in registry['excluded_or_restricted']

          bank = build_bank()
          assert bank['provider_count'] == 100
          assert bank['spend_limit_eur'] == 0
          assert bank['paid_fallback'] is False

          py_compile.compile('api/cerebron-worker.py', doraise=True)
          py_compile.compile('cerebron/providers/federated_compute.py', doraise=True)
          py_compile.compile('cerebron/providers/federated_worker_contract.py', doraise=True)
          assert pathlib.Path('netlify/functions/cerebron-worker.mjs').is_file()
          assert pathlib.Path('supabase/functions/cerebron-worker/index.ts').is_file()

          out = {
            'schema': 'cerebron-federation-selftest-v4',
            'contract_ok': True,
            'external_execution_enabled': False,
            'providers': status,
            'approved_free_tiers': sorted(approved),
            'provider_bank_count': bank['provider_count'],
            'spend_limit_eur': 0,
            'paid_fallback': False,
          }
          os.makedirs('out', exist_ok=True)
          json.dump(out, open('out/federation-selftest.json','w'), indent=2)
          print(json.dumps(out, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-federation-selftest
          path: out/federation-selftest.json
          retention-days: 14
