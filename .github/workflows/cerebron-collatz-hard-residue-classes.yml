name: CEREBRON Collatz Hard Residue Classes

on:
  workflow_dispatch:
  push:
    paths:
      - 'cerebron/collatz/analyze_hard_residue_classes.py'
      - '.github/workflows/cerebron-collatz-hard-residue-classes.yml'

permissions:
  contents: read

jobs:
  residue-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze hard residue classes
        run: python cerebron/collatz/analyze_hard_residue_classes.py
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-hard-residue-classes
          path: collatz-hard-residue-classes.json
          retention-days: 14
