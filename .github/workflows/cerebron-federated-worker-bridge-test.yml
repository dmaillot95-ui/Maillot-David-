name: CEREBRON Orchestrated Federated Wave

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cerebron/federation/core/federated_multiwave_orchestrator.py'
      - 'cerebron/federation/core/federated_worker_bridge.py'
      - 'cerebron/federation/core/federated_wave_commit.py'
      - 'cerebron/federation/core/federated_wave_reducer.py'
      - 'cerebron/federation/core/provider_adapters.py'
      - 'cerebron/federation/state/retry-request.json'
      - '.github/workflows/cerebron-federated-worker-bridge-test.yml'

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        name: Plan next 20-address wave or consume explicit retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plan-out
          python - <<'PY'
          import json
          from pathlib import Path

          state_path=Path('cerebron/federation/state/federated-multiwave-state.json')
          retry_path=Path('cerebron/federation/state/retry-request.json')
          state=json.load(open(state_path))
          retry={}
          if retry_path.exists():
              retry=json.load(open(retry_path))

          wave=[]
          if retry.get('status') == 'REQUESTED':
              ids=list(retry.get('assignment_ids') or [])[:int(state.get('physical_cap',20))]
              current_wave=int(state.get('wave_number',0))
              for lane,aid in enumerate(ids):
                  info=state.get('failed',{}).pop(aid,None)
                  if not info:
                      continue
                  mid=info['mission_id']
                  ms=state['missions'][mid]
                  ms['failed_count']=max(0,int(ms.get('failed_count',0))-1)
                  info=dict(info)
                  info['status']='DISPATCHED'
                  info['physical_lane']=lane
                  info['wave_number']=current_wave
                  state['inflight'][aid]=dict(info)
                  wave.append(info)
              if wave:
                  state['last_wave']=wave
                  state['wave_number']=current_wave+1
                  state.setdefault('history',[]).append({
                      'wave_number':current_wave,
                      'assignments':[x['assignment_id'] for x in wave],
                      'retry':True,
                  })
              retry['status']='CONSUMED'
              retry['consumed_wave_number']=current_wave if wave else None
              retry['consumed_count']=len(wave)
              retry_path.write_text(json.dumps(retry,ensure_ascii=False,indent=2)+'\n')
              state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
              payload={'wave':wave,'summary':{
                  'logical_total':state.get('logical_total'),
                  'physical_cap':state.get('physical_cap'),
                  'wave_number':state.get('wave_number'),
                  'inflight':len(state.get('inflight',{})),
                  'completed':len(state.get('completed',{})),
                  'failed':len(state.get('failed',{})),
                  'last_wave_size':len(wave),
                  'retry_consumed':True,
              }}
              Path('plan-out/plan.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          else:
              import subprocess
              cp=subprocess.run([
                  'python','cerebron/federation/core/federated_multiwave_orchestrator.py','--wave-size','20'
              ],capture_output=True,text=True,check=True)
              Path('plan-out/plan.json').write_text(cp.stdout)
          PY
          cp cerebron/federation/state/federated-multiwave-state.json plan-out/federated-multiwave-state.json
          cp cerebron/federation/state/retry-request.json plan-out/retry-request.json 2>/dev/null || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('plan-out/plan.json'))
          wave=p.get('wave',[])
          include=[]
          for x in wave:
              include.append({
                  'assignment_id':x['assignment_id'],
                  'mission_id':x['mission_id'],
                  'address':x['address'],
                  'wave_number':x['wave_number'],
                  'physical_lane':x['physical_lane'],
              })
          print('matrix='+json.dumps({'include':include},separators=(',',':')))
          print('has_work='+('true' if include else 'false'))
          PY
          cat plan-out/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrated-wave-plan
          path: plan-out/

  federated-worker:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HF bridge client
        run: pip install hf-gradio
      - name: Execute orchestrated federated assignment
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_MODEL: openai/gpt-oss-20b
          CLOUDFLARE_AI_MODEL: '@cf/zai-org/glm-4.7-flash'
        run: |
          set -euo pipefail
          mkdir -p out
          python cerebron/federation/core/federated_worker_bridge.py \
            --address '${{ matrix.address }}' \
            --assignment-id '${{ matrix.assignment_id }}' \
            --mission-id '${{ matrix.mission_id }}' \
            --wave-number '${{ matrix.wave_number }}' \
            --output 'out/result-${{ matrix.physical_lane }}.json' \
            --role PROOF_A \
            --objective 'CEREBRON orchestrated federated execution. Produce useful evidence; never invent evidence.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestrated-worker-${{ matrix.physical_lane }}
          path: out/*.json
          if-no-files-found: ignore

  reduce:
    needs: [plan, federated-worker]
    if: always() && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download planned persistent state
        uses: actions/download-artifact@v4
        with:
          name: orchestrated-wave-plan
          path: plan-in
      - name: Restore planned state and consumed retry marker
        run: |
          cp plan-in/federated-multiwave-state.json cerebron/federation/state/federated-multiwave-state.json
          if [ -f plan-in/retry-request.json ]; then
            cp plan-in/retry-request.json cerebron/federation/state/retry-request.json
          fi
      - name: Download worker artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orchestrated-worker-*
          path: wave-artifacts
          merge-multiple: true
      - name: Commit worker terminal states
        run: |
          python cerebron/federation/core/federated_wave_commit.py \
            --state cerebron/federation/state/federated-multiwave-state.json \
            --artifacts wave-artifacts \
            --report cerebron/federation/state/orchestrated-wave-report-latest.json
      - name: Reduce telemetry and update provider memory
        run: |
          python cerebron/federation/core/federated_wave_reducer.py \
            --artifacts wave-artifacts \
            --runtime cerebron/federation/state/provider-runtime.json \
            --summary cerebron/federation/state/wave-summary-latest.json
      - name: Verify no stale inflight assignment
        run: |
          python - <<'PY'
          import json
          s=json.load(open('cerebron/federation/state/federated-multiwave-state.json'))
          r=json.load(open('cerebron/federation/state/orchestrated-wave-report-latest.json'))
          assert r['completed_count']+r['failed_count'] == len(s.get('last_wave',[])), r
          assert r['state_inflight'] == 0, r
          print('CEREBRON_ORCHESTRATED_WAVE_TERMINAL_OK', r['completed_count'], r['failed_count'])
          print('NEXT_WAVE_NUMBER', s['wave_number'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrated-wave-summary
          path: |
            cerebron/federation/state/orchestrated-wave-report-latest.json
            cerebron/federation/state/wave-summary-latest.json
            cerebron/federation/state/federated-multiwave-state.json
            cerebron/federation/state/retry-request.json
      - name: Persist orchestrator and routing memory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cerebron-bot'
          git config user.email 'cerebron-bot@users.noreply.github.com'
          git add \
            cerebron/federation/state/federated-multiwave-state.json \
            cerebron/federation/state/provider-runtime.json \
            cerebron/federation/state/wave-summary-latest.json \
            cerebron/federation/state/orchestrated-wave-report-latest.json \
            cerebron/federation/state/retry-request.json
          if git diff --cached --quiet; then
            echo 'No state change.'
            exit 0
          fi
          git commit -m 'Persist orchestrated federated wave state'
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((n*2)); continue; }
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
