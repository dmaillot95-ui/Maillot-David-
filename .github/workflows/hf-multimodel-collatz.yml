name: CEREBRON HF 20 Independent Collatz Agents

on:
  push:
    paths:
      - '.github/workflows/hf-multimodel-collatz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agents:
    name: ${{ matrix.model_id }}-${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        model_id: [llama3b, gemma2b, gemma9b, mistral7b, gemma3_12b]
        role: [PROOF, AUDIT, REDTEAM, SYNTHESIS]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Gradio client
        run: pip install --quiet hf-gradio

      - name: Run one real external agent
        env:
          MODEL_ID: ${{ matrix.model_id }}
          ROLE: ${{ matrix.role }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          model_id = os.environ['MODEL_ID']
          role = os.environ['ROLE']
          spaces = {
              'llama3b': 'huggingface-projects/llama-3.2-3B-Instruct',
              'gemma2b': 'huggingface-projects/gemma-2-2b-it',
              'gemma9b': 'huggingface-projects/gemma-2-9b-it',
              'mistral7b': 'hysts/mistral-7b',
              'gemma3_12b': 'huggingface-projects/gemma-3-12b-it',
          }
          space = spaces[model_id]
          out_path = Path(f'result-{model_id}-{role.lower()}.txt')

          prompts = {
              'PROOF': (
                  "Étudie rigoureusement l'application accélérée de Collatz sur les impairs positifs "
                  "T(x)=(3x+1)/2^{v2(3x+1)}. Suppose un cycle hypothétique de CINQ termes impairs "
                  "x0,x1,x2,x3,x4 avec a_i=v2(3x_i+1)>=1 et x_{i+1}=(3x_i+1)/2^{a_i}, indices modulo 5. "
                  "Dérive explicitement par substitution l'identité cyclique exacte en fonction de A=sum a_i "
                  "et des sommes partielles s_j. Déduis uniquement les contraintes nécessaires justifiées. "
                  "N'utilise jamais a_i pour désigner les x_i. Sépare PROUVÉ / À PROUVER. 350 mots max."
              ),
              'AUDIT': (
                  "Audit mathématique indépendant. Pour un cycle de cinq IMPAIRS x0..x4 de Collatz accéléré, "
                  "avec a_i=v2(3x_i+1), A=sum a_i, s_0=0, s_j=sum_{i=0}^{j-1}a_i, vérifie par dérivation "
                  "l'identité x0(2^A-3^5)=sum_{j=0}^{4} 3^{4-j}2^{s_j}. Vérifie aussi 2^A>3^5, "
                  "l'intégralité, les cinq rotations, et explique ce que l'identité ne suffit PAS à démontrer. "
                  "Si une formule fournie est fausse, corrige-la. 350 mots max."
              ),
              'REDTEAM': (
                  "Red Team rigoureuse sur l'hypothèse d'un cycle positif non trivial de CINQ termes impairs "
                  "pour T(x)=(3x+1)/2^{v2(3x+1)}. Travaille avec x_i pour les états et a_i pour les valuations. "
                  "Teste les arguments basés sur le minimum du cycle, son prédécesseur, les rotations, la divisibilité "
                  "et l'identité cyclique. Cherche activement un contre-exemple aux lemmes proposés. "
                  "Ne qualifie jamais une trajectoire vers 1 de cycle non trivial. Termine par OBSTACLE RESTANT. 350 mots max."
              ),
              'SYNTHESIS': (
                  "Objectif: éliminer rigoureusement les cycles positifs non triviaux de longueur impaire N=5 "
                  "de l'application accélérée de Collatz. À partir de l'identité cyclique exacte, propose UN lemme "
                  "falsifiable et suffisamment précis pour être la prochaine cible. Donne: énoncé, raison de suffisance, "
                  "plan de preuve, cas limites, et une vérification computationnelle indépendante qui pourrait le réfuter. "
                  "Étiquette THEOREM seulement un fait effectivement dérivé; sinon TARGET/CONJECTURE. 350 mots max."
              ),
          }
          prompt = prompts[role]

          def run(cmd, timeout=240):
              return subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)

          def load_api():
              p = run(['hf-gradio', 'info', space], 120)
              if p.returncode != 0:
                  raise RuntimeError('INFO_FAILED: ' + p.stderr[-1800:])
              try:
                  return json.loads(p.stdout)
              except Exception:
                  raise RuntimeError('INFO_NOT_JSON: ' + (p.stdout + p.stderr)[-1800:])

          def candidate_payloads(api):
              preferred = ['/generate', '/chat', '/predict', '/respond', '/infer']
              endpoints = list(api.items())
              endpoints.sort(key=lambda kv: (preferred.index(kv[0]) if kv[0] in preferred else 99, kv[0]))
              for endpoint, spec in endpoints:
                  params = spec.get('parameters', [])
                  payload = {}
                  prompt_set = False
                  compatible = True
                  for p in params:
                      name = p.get('name', '')
                      lname = name.lower()
                      required = bool(p.get('required', False))
                      default = p.get('default', None)
                      typ = (p.get('type') or {}).get('type')
                      if lname in {'message','prompt','text','query','input','instruction','user_message'}:
                          payload[name] = prompt
                          prompt_set = True
                      elif lname in {'chat_history','history','messages'}:
                          payload[name] = []
                      elif lname in {'max_new_tokens','max_tokens','maximum_new_tokens'}:
                          payload[name] = 420
                      elif lname == 'temperature':
                          payload[name] = 0.1
                      elif lname == 'top_p':
                          payload[name] = 0.9
                      elif lname == 'top_k':
                          payload[name] = 40
                      elif lname in {'repetition_penalty','repeat_penalty'}:
                          payload[name] = 1.0
                      elif lname in {'system_prompt','system'}:
                          payload[name] = 'Tu es un auditeur mathématique. Exactitude > assurance. Aucune conclusion sans dérivation.'
                      elif required and default is None:
                          if typ == 'string' and not prompt_set:
                              payload[name] = prompt
                              prompt_set = True
                          else:
                              compatible = False
                              break
                  if compatible and prompt_set:
                      yield endpoint, payload

          success = False
          endpoint_used = None
          response = ''
          errors = []
          try:
              api = load_api()
              for endpoint, payload in candidate_payloads(api):
                  try:
                      p = run(['hf-gradio', 'predict', space, endpoint, json.dumps(payload, ensure_ascii=False)])
                  except Exception as exc:
                      errors.append(f'{endpoint}: {exc}')
                      continue
                  if p.returncode == 0 and p.stdout.strip():
                      success = True
                      endpoint_used = endpoint
                      response = p.stdout.strip()
                      break
                  errors.append(f'{endpoint}: rc={p.returncode}; {(p.stderr or p.stdout)[-1200:]}')
          except Exception as exc:
              errors.append(str(exc))

          with out_path.open('w', encoding='utf-8') as out:
              out.write(f'MODEL_SPACE={space}\nMODEL_ID={model_id}\nROLE={role}\nSUCCESS={1 if success else 0}\n')
              if endpoint_used:
                  out.write(f'ENDPOINT={endpoint_used}\n')
              out.write('\n')
              if response:
                  out.write(response + '\n')
              if errors:
                  out.write('\nERRORS:\n' + '\n'.join(errors[-5:]) + '\n')

          print(out_path.read_text(encoding='utf-8'))
          if not success:
              sys.exit(1)
          PY

      - name: Upload agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.model_id }}-${{ matrix.role }}
          path: result-*.txt
          if-no-files-found: warn

  aggregate:
    name: aggregate-20-agent-results
    if: always()
    needs: agents
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Build combined report
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('results').glob('result-*.txt'))
          success = 0
          model_ids = set()
          roles = set()
          text = []
          for f in files:
              body = f.read_text(encoding='utf-8')
              text.append(f'######## {f.name} ########\n{body}')
              vals = {}
              for line in body.splitlines():
                  if '=' in line and line.split('=',1)[0] in {'MODEL_ID','ROLE','SUCCESS'}:
                      k,v = line.split('=',1)
                      vals[k]=v
              model_ids.add(vals.get('MODEL_ID','UNKNOWN'))
              roles.add(vals.get('ROLE','UNKNOWN'))
              success += 1 if vals.get('SUCCESS') == '1' else 0
          header = (
              'CEREBRON_REAL_EXTERNAL_AGENTS\n'
              'EXPECTED_CALLS=20\n'
              f'RESULT_FILES={len(files)}/20\n'
              f'SUCCESSFUL_CALLS={success}/20\n'
              f'MODEL_GROUPS_SEEN={len(model_ids)}/5\n'
              f'ROLES_SEEN={len(roles)}/4\n\n'
          )
          Path('combined-20-independent-collatz.txt').write_text(header + '\n'.join(text), encoding='utf-8')
          print(Path('combined-20-independent-collatz.txt').read_text(encoding='utf-8'))
          PY

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: cerebron-20-independent-collatz
          path: combined-20-independent-collatz.txt
