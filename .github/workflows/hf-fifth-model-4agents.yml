name: CEREBRON HF Fifth Model 4 Agents

on:
  push:
    paths:
      - '.github/workflows/hf-fifth-model-4agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: llama1b-${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        role: [PROOF, AUDIT, REDTEAM, SYNTHESIS]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client
        run: pip install --quiet hf-gradio
      - name: Run real Llama 1B agent
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          space='huggingface-projects/llama-3.2-1B-Instruct'
          role=os.environ['ROLE']
          prompts={
            'PROOF':"Étudie rigoureusement un cycle hypothétique de CINQ termes impairs x0..x4 de l'application accélérée de Collatz T(x)=(3x+1)/2^{v2(3x+1)}, avec a_i=v2(3x_i+1). Dérive l'identité cyclique exacte. Sépare PROUVÉ/À PROUVER. 250 mots max.",
            'AUDIT':"Audit indépendant: vérifie par dérivation x0(2^A-3^5)=sum_{j=0}^{4}3^{4-j}2^{s_j}, A=sum a_i, s_0=0, s_j=sum_{i<j}a_i. Signale toute erreur et ce que cela ne prouve pas. 250 mots max.",
            'REDTEAM':"Red Team rigoureuse sur l'existence d'un cycle positif non trivial de CINQ termes impairs de Collatz accéléré. Teste minimum, prédécesseur, rotations, divisibilité, identité cyclique. Ne prétends pas conclure sans preuve. Termine par OBSTACLE RESTANT. 250 mots max.",
            'SYNTHESIS':"Propose UNE prochaine cible falsifiable pour éliminer les cycles positifs non triviaux de longueur N=5 de Collatz accéléré. Étiquette THEOREM seulement ce qui est dérivé, sinon TARGET/CONJECTURE. Donne énoncé, suffisance, plan, test indépendant. 250 mots max."
          }
          p=subprocess.run(['hf-gradio','info',space],capture_output=True,text=True,timeout=120)
          if p.returncode: print(p.stderr); sys.exit(1)
          api=json.loads(p.stdout)
          spec=api['/generate']['parameters']
          payload={}
          for q in spec:
            n=q['name']
            if n=='message': payload[n]=prompts[role]
            elif n=='max_new_tokens': payload[n]=320
            elif n=='temperature': payload[n]=0.1
            elif n=='top_p': payload[n]=0.9
            elif n=='top_k': payload[n]=40
            elif n=='repetition_penalty': payload[n]=1.0
          r=subprocess.run(['hf-gradio','predict',space,'/generate',json.dumps(payload,ensure_ascii=False)],capture_output=True,text=True,timeout=240)
          success=r.returncode==0 and bool(r.stdout.strip())
          out=Path(f'llama1b-{role.lower()}.txt')
          out.write_text(f'MODEL={space}\nROLE={role}\nSUCCESS={int(success)}\n\n'+(r.stdout if success else r.stderr),encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          if not success: sys.exit(1)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama1b-${{ matrix.role }}
          path: llama1b-*.txt
