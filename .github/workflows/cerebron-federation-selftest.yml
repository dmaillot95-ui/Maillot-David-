name: CEREBRON Federation Selftest

on:
  workflow_dispatch:
  push:
    paths:
      - 'cerebron/providers/federated_worker_contract.py'
      - 'cerebron/providers/federated_compute.py'
      - 'cerebron/providers/provider_bank.py'
      - '.github/workflows/cerebron-federation-selftest.yml'

permissions:
  contents: read

jobs:
  federation-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate federation contract and safe defaults
        run: |
          python - <<'PY'
          import json, os
          from cerebron.providers.federated_worker_contract import WorkerTask, validate_zero_euro
          from cerebron.providers.federated_compute import provider_status
          from cerebron.providers.provider_bank import build_bank

          task = WorkerTask.create('SELFTEST', 'Return only OK')
          validate_zero_euro(task)
          status = provider_status()
          assert set(status) == {'vercel','scaleway','alibaba'}
          assert os.getenv('CEREBRON_FEDERATION_ENABLE','0') != '1'
          assert all(v['enabled'] is False for v in status.values())
          assert all(v['paid_fallback'] is False for v in status.values())

          bank = build_bank()
          assert bank['provider_count'] == 100
          assert bank['spend_limit_eur'] == 0
          assert bank['paid_fallback'] is False

          out = {
            'schema': 'cerebron-federation-selftest-v1',
            'contract_ok': True,
            'external_execution_enabled': False,
            'providers': status,
            'provider_bank_count': bank['provider_count'],
            'spend_limit_eur': 0,
            'paid_fallback': False,
          }
          os.makedirs('out', exist_ok=True)
          json.dump(out, open('out/federation-selftest.json','w'), indent=2)
          print(json.dumps(out, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-federation-selftest
          path: out/federation-selftest.json
          retention-days: 14
