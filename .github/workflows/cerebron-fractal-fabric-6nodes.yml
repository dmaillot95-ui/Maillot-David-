name: CEREBRON Fractal Fabric 6-Node Test

on:
  push:
    paths:
      - 'cerebron/fractal_fabric/test_fractal_fabric_6nodes.py'
      - '.github/workflows/cerebron-fractal-fabric-6nodes.yml'
  workflow_dispatch:

jobs:
  shard:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CEREBRON_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run shard
        run: python cerebron/fractal_fabric/test_fractal_fabric_6nodes.py
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-fractal-shard-${{ matrix.shard }}
          path: fractal-fabric-shard-${{ matrix.shard }}.json
          retention-days: 14
