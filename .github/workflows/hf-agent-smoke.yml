name: CEREBRON HF Agent Smoke

on:
  push:
    paths:
      - '.github/workflows/hf-agent-smoke.yml'

permissions:
  contents: read

jobs:
  external-agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face Gradio client
        run: pip install --quiet hf-gradio
      - name: Discover Llama Space API
        run: hf-gradio info huggingface-projects/llama-3.2-3B-Instruct | tee /tmp/hf-info.json
      - name: Call real external Llama agent
        run: |
          hf-gradio predict huggingface-projects/llama-3.2-3B-Instruct /generate '{"message":"Réponds sur une seule ligne exactement sous la forme HF_AGENT_OK | 37*41=<résultat>","max_new_tokens":64,"temperature":0.1,"top_p":0.9,"top_k":40,"repetition_penalty":1.0}' | tee /tmp/hf-result.json
          grep -q 'HF_AGENT_OK' /tmp/hf-result.json
