name: CEREBRON Civilization V2 36 Workers

on:
  push:
    paths:
      - 'cerebron/civilization/CAPABILITIES_V2.md'
      - 'cerebron/civilization/campaign_memory.py'
      - 'cerebron/civilization/civilization_v2_runner.py'
      - '.github/workflows/cerebron-civilization-capabilities-v2.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 1 * * *'

permissions:
  contents: read

jobs:
  civilization-worker:
    strategy:
      fail-fast: false
      max-parallel: 36
      matrix:
        role:
          - ARCHITECTURE
          - SCIENCE
          - INFRASTRUCTURE
          - ECONOMY
          - GOVERNANCE
          - KNOWLEDGE
          - INDUSTRY
          - CULTURE
          - SECURITY
          - EXPLORATION
          - REDTEAM
          - EVALUATOR
        mode:
          - INVERT
          - TRANSFER
          - EMERGE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build evidence bounded campaign memory
        run: python cerebron/civilization/campaign_memory.py --out out/memory --sample 180
      - name: Install local inference runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors sentencepiece
      - name: Run worker with C1-C11 and experience replay
        env:
          ROLE: ${{ matrix.role }}
          MODE: ${{ matrix.mode }}
          CEREBRON_LOCAL_CPU_MODEL: HuggingFaceTB/SmolLM2-360M-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '620'
          CEREBRON_LOCAL_CPU_OUT: out/result.json
        run: python cerebron/civilization/civilization_v2_runner.py worker
      - uses: actions/upload-artifact@v4
        with:
          name: civilization-v2-${{ matrix.role }}-${{ matrix.mode }}
          path: out/result.json
          retention-days: 90

  civilization-synthesis:
    needs: civilization-worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current campaign memory
        run: python cerebron/civilization/campaign_memory.py --out out/memory --sample 180
      - uses: actions/download-artifact@v4
        with:
          pattern: civilization-v2-*
          path: civilization
          merge-multiple: false
      - name: Install synthesis runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers>=4.56,<5' 'torch>=2.4' safetensors sentencepiece
      - name: Synthesize 36 workers with historical memory
        env:
          CEREBRON_LOCAL_CPU_MODEL: Qwen/Qwen2.5-1.5B-Instruct
          CEREBRON_LOCAL_CPU_MAX_NEW_TOKENS: '2600'
          CEREBRON_LOCAL_CPU_OUT: out/synthesis.json
        run: python cerebron/civilization/civilization_v2_runner.py synthesis
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-civilization-v2-36-memory-report
          path: |
            out/workers.json
            out/packet.txt
            out/synthesis.json
            out/memory/campaign-summary.json
            out/memory/strategy-candidates.json
            out/memory/outcome-divergence.json
            out/memory/role-performance.json
            out/memory/memory-packet.json
          retention-days: 90
