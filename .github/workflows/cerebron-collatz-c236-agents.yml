name: CEREBRON Collatz C236 Polymorphic Wave

on:
  push:
    paths:
      - '.github/workflows/cerebron-collatz-c236-agents.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebron-collatz-c236-polymorphic-wave
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          A=[
          ('THEORETICAL_MATHEMATICIAN','PROOF_A','llama3b','prove or refute arbitrary-length balanced episode feasibility'),
          ('NUMBER_THEORIST','PROOF_A','llama3b','derive exact residue class and integer existence criterion'),
          ('DYNAMICAL_SYSTEMS_SPECIALIST','PROOF_A','llama3b','formalize full first-exit stay-out first-reentry inequalities'),
          ('COMBINATORICS_SPECIALIST','DECOMPOSER','llama3b','analyze mechanical/Sturmian balanced valuation words and phases'),
          ('ERGODIC_SPECTRAL_SPECIALIST','PROOF_B','gemma9b','derive implications for exact first-return operator'),
          ('P_ADIC_SPECIALIST','PROOF_A','llama3b','compute exact cylinder modulus and spacing for fixed words'),
          ('ARCHIMEDEAN_ANALYST','PROOF_B','gemma9b','derive exact episode interval endpoints and widths'),
          ('DIOPHANTINE_SPECIALIST','ALTERNATIVE_ROUTE','gemma9b','analyze alpha=log2(3) discrepancy and phase-shift approximants'),
          ('FORMAL_PROOF_AUDITOR','COUNTER_AUDITOR','gemma9b','audit balanced-word lemma and all quantifiers'),
          ('COUNTEREXAMPLE_HUNTER','FALSIFIER','llama3b','seek long balanced words with empty or nonempty episode intervals'),
          ('COMPUTATIONAL_EXPERIMENTER','FALSIFIER','gemma2b','finite search across phases only to falsify universal claims'),
          ('PROOF_SYNTHESIST','SYNTHESIZER','gemma9b','merge only audited results and isolate residual'),
          ('POLYMORPHIC_MATHEMATICIAN','ALTERNATIVE_ROUTE','llama3b','switch specialty against hardest residual'),
          ('CREATOR_A','PROOF_A','llama3b','constructive arbitrary-length feasibility attempt'),
          ('CREATOR_B','PROOF_B','gemma9b','independent obstruction attempt via interval/cylinder geometry'),
          ('VERIFIER','REPLICATOR','gemma9b','independently rederive constants formulas and criterion'),
          ('AUDITOR','COUNTER_AUDITOR','gemma9b','audit strongest candidate theorem end-to-end'),
          ('COUNTER_AUDITOR','RED_TEAM','llama3b','attack strongest audit and theorem'),
          ('JUDGE','JUDGE','gemma9b','classify PROVED REFUTED HOLD; reject unsupported closure'),
          ('META_COORDINATOR','SYNTHESIZER','gemma9b','compare contradictions evidence and nextlock')]
          print('matrix='+json.dumps({'include':[{'functional_role':fr,'base_role':br,'model_id':mid,'family':('llama-3.2' if mid=='llama3b' else 'gemma-2'),'focus':focus} for fr,br,mid,focus in A]},separators=(',',':')))
          print('has_work=true')
          PY

  external-agent:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet hf-gradio
      - name: Execute polymorphic Collatz agent
        env:
          FUNCTIONAL_ROLE: ${{ matrix.functional_role }}
          BASE_ROLE: ${{ matrix.base_role }}
          MODEL_ID: ${{ matrix.model_id }}
          FAMILY: ${{ matrix.family }}
          FOCUS: ${{ matrix.focus }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,os,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,'cerebron/federation/core')
          import shard_worker
          reg=json.loads(Path('cerebron/federation/state/model-registry.json').read_text())
          mission_text=Path('cerebron/intelligence/COLLATZ-C236-C245-AGENT-MISSION.md').read_text()
          mid=os.environ['MODEL_ID']; br=os.environ['BASE_ROLE']; fr=os.environ['FUNCTIONAL_ROLE']; fam=os.environ['FAMILY']; focus=os.environ['FOCUS']
          model={'model_id':mid, **reg['models'][mid]}
          task={'task_id':f'COLLATZ-C236-{fr}-{mid}','role':br,'civilization':'CEREBRON','team':'COLLATZ_C236','mission_id':'COLLATZ-C236'}
          mission={'title':'COLLATZ C236 — BALANCED PROFILE FEASIBILITY','objective':focus}
          base=shard_worker.role_prompt(task,mission,'Attack the C236 balanced-profile feasibility lock')
          prompt=base+'\n\nPOLYMORPHIC SPECIALTY: '+fr+'\nFOCUS: '+focus+'\n\nCHECKPOINT:\n'+mission_text+'\nReturn compact mathematics with explicit proof status.'
          ok,text,meta=shard_worker.invoke_hf(model,prompt)
          result={'schema':'cerebron-collatz-c236-agent-v1','functional_role':fr,'base_role':br,'model_id':mid,'model_family':fam,'ok':bool(ok),'execution_status':'COMPLETED' if ok else 'FAILED_RETRYABLE','response':text if ok else None,'response_sha256':hashlib.sha256(text.encode()).hexdigest() if ok and text else None,'evidence_status':'UNREVIEWED_EXTERNAL_AGENT_OUTPUT' if ok else 'NO_EXTERNAL_OUTPUT'}
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz-c236-${{ matrix.functional_role }}-${{ matrix.model_id }}
          path: out/result.json
          retention-days: 14

  omega-fusion:
    needs: external-agent
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: collatz-c236-*
          path: results
          merge-multiple: false
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('results').rglob('result.json'):
            try: rows.append(json.loads(p.read_text()))
            except: pass
          ok=[r for r in rows if r.get('ok')]
          report={'schema':'cerebron-collatz-c236-omega-v1','artifact_rows':len(rows),'successful_external_ai_calls':len(ok),'successful_model_families':sorted({r.get('model_family') for r in ok}),'successful_functional_roles':sorted({r.get('functional_role') for r in ok}),'independent_engine_count':len({r.get('model_family') for r in ok}),'claim_note':'Unaudited agent hypotheses until assistant verification.'}
          Path('c236-agent-accounting.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          Path('c236-agent-packet.txt').write_text('\n\n'.join('ROLE '+str(r.get('functional_role'))+' | '+str(r.get('model_family'))+'\n'+str(r.get('response') or '') for r in ok))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-c236-omega-packet
          path: |
            c236-agent-accounting.json
            c236-agent-packet.txt
          retention-days: 14
